<form method="get">
    <input type="text" name="q">
    
    <select name="genre">
        <option value="">All</option>
        <option value="Pop">Pop</option>
        <option value="Rock">Rock</option>
    </select>

    <button type="submit">Search</button>
</form>

<h2>Results:</h2>

{% for song in songs %}
    <div>
        <h3>{{ song.title }}</h3>
        <p>{{ song.artist }}</p>
    </div>
    <audio controls>
        <source src="/stream/{{ song.id }}/" type="audio/mpeg">
    </audio>
{% endfor %}
