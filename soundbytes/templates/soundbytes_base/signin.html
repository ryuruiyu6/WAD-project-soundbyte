{% extends 'base.html' %}
{% load static %}

{% block title %}
	Sign-In
{% endblock %}

{% block body %}
	<h1>Sign in to Soundbytes</h1>
	<form id="login_form" method="post" action="{% url 'soundbytes:signin' %}">
		{% csrf_token %}
		Username: <input type="text" name="username" value="" size="50" /><br />
		Password: <input type="password" name="password" value="" size="50" /><br />
		<input type="submit" value="submit" />
	</form>
{% endblock %}
